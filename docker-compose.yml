services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-watchtracker_dummy.db}
      - TMDB_API_KEY=${TMDB_API_KEY:-your_tmdb_api_key}
    volumes:
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
