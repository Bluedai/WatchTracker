services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serien-tracker-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/serien_tracker.db
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serien-tracker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
